<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birth Certificate</title>

<style>
    @page {
        size: A4;
        margin: 0;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #ddd;
    }

    .a4 {
        width: 210mm;
        height: 297mm;
        margin: 0 auto;
        background: white;
        overflow: hidden;
    }

    .a4 img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    @media print {
        html, body {
            background: white;
        }

        .a4 {
            margin: 0;
        }
    }
</style>
</head>

<body>

<div class="a4">
    <img src="image/photo.png" alt="Photo">
</div>

</body>
</html>
